[project]
name = "forge-cli"
version = "0.1.0"
description = "AshcrestHQ's learn-by-doing CLI — security fundamentals and open source contribution skills, one lesson at a time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = ["lessons/**/*"]
